services:
  frontend:
    container_name: Frontend
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - web-net
    restart: unless-stopped

  backend:
    container_name: Backend
    build: ./backend
    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      MONGODB_URI: mongodb://Database-mongo:27017/wanderlust
      JWT_SECRET: mysecretkey
      

    depends_on:
      - mongo

    networks:
      - web-net
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: Database-mongo
    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    networks:
      - web-net
    restart: unless-stopped
  
  redis:
    image: redis:7
    container_name: Redis
    ports:
    - "6379:6379"
    networks:
      - web-net


volumes:
  mongo-data:

networks:
  web-net:
    driver: bridge