apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}
  namespace: {{ .Values.backend.namespace }}
  labels:
    app: {{ .Values.backend.app }}

spec:
  replicas: {{ .Values.backend.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.backend.app }}

  template:
    metadata:
      labels:
        app: {{ .Values.backend.app }}

    spec:
      containers:
        - name: {{ .Values.backend.name }}
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.backend.imagePullPolicy }}

          ports:
            - containerPort: {{ .Values.backend.port }}

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-backend-config

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-backend-secret
                  key: JWT_SECRET

          startupProbe:
            httpGet:
              path: {{ .Values.backend.path }}
              port: {{ .Values.backend.port }}
            failureThreshold: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: {{ .Values.backend.path }}
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: {{ .Values.backend.path }}
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: {{ .Values.backend.namespace }}

spec:
  type: ClusterIP

  selector:
    app: {{ .Values.backend.app }}

  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.targetPort }}