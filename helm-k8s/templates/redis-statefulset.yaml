apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.redis.name }}
  namespace: {{ .Values.redis.namespace }}
spec:
  serviceName: {{ .Values.redis.serviceName }}
  replicas: {{ .Values.redis.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.redis.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.redis.app }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: {{ .Values.redis.pullPolicy }}
          ports:
            - containerPort: {{ .Values.redis.port }}
          command: ["redis-server"]
          args: ["--appendonly", "yes"]     # enable AOF persistence
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
  volumeClaimTemplates:
    - metadata:
        name: data
        namespace: {{ .Values.redis.namespace }}
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.redis.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.redis.storageSize }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.serviceName }}
  namespace: {{ .Values.redis.namespace }}
spec:
  selector:
    app: {{ .Values.redis.app }}
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
  clusterIP: None        # headless — stable DNS for StatefulSet